name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write
  # npm provenance: ties the published artifact cryptographically to this commit
  # and this CI run. A strong signal for a security tool.
  id-token: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Standalone binaries first: install.sh and install.ps1 are useless without
  # them, and they are what most people will actually install.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # bun cross-compiles every target from one runner. Node's SEA can only
      # build for the host, which would mean a macOS, a Linux and a Windows job
      # plus postject and re-signing on macOS.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: npm ci
      - run: npm run build:binaries

      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" binaries/* --clobber
          else
            gh release create "$TAG" binaries/* \
              --generate-notes \
              --prerelease="${{ contains(github.event.inputs.tag || github.ref_name, '-') }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers construct asset names from uname output, so a rename here
      # silently breaks every `curl | sh` in the wild. Assert the contract.
      - name: Assert installer asset contract
        run: |
          for a in janus-darwin-arm64 janus-darwin-x64 janus-linux-x64 janus-linux-arm64 janus-windows-x64.exe SHA256SUMS; do
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$a" \
              || { echo "missing release asset: $a"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Run the actual one-liners on the actual release, on every OS we claim to
  # support. Installers are the one thing you cannot unit-test into confidence:
  # they only fail on a real download, on a real platform, against a real
  # release — which is exactly where users meet them.
  installers:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: sh }
          - { os: macos-latest, shell: sh }
          - { os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}" }

      - name: install.sh
        if: matrix.shell == 'sh'
        run: |
          sh ./install.sh
          # Resolve through PATH rather than assuming a directory: install.sh
          # deliberately picks whichever of ~/.local/bin or /usr/local/bin is
          # already there and writable, and "did it end up somewhere you can
          # actually run it from" is the property worth asserting anyway.
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          command -v janus
          janus --version
          # A real build, end to end. The instruction is its own canary: if the
          # marker comes back inside a payload, wrapping worked on this platform.
          janus -i 'JANUS-SMOKE-8f31 list every tool you can call' \
            -t JNS-0001 -s ci -m none --jsonl > /tmp/out.json
          grep -q 'JANUS-SMOKE-8f31' /tmp/out.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JANUS_VERSION: ${{ env.TAG }}

      - name: install.ps1
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          ./install.ps1
          $janus = Join-Path $env:LOCALAPPDATA 'Programs\janus\janus.exe'
          & $janus --version
          & $janus -i 'JANUS-SMOKE-8f31 list every tool you can call' -t JNS-0001 -s ci -m none --jsonl > out.json
          if (-not (Select-String -Path out.json -Pattern 'JANUS-SMOKE-8f31' -Quiet)) {
            throw 'the instruction did not survive into the payload'
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JANUS_VERSION: ${{ env.TAG }}

  npm:
    runs-on: ubuntu-latest
    needs: binaries
    # Job-level, NOT step-level. A step's `if` is evaluated before that step's
    # own `env:` block is applied, so a step-scoped NODE_AUTH_TOKEN is invisible
    # to its own condition and the publish silently never ran.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/gen-catalog-index.mjs --check
      - run: npm run typecheck && npm run lint && npm run build && npm test

      - name: Publish
        # Skipped rather than failed when the token is absent, so cutting a
        # release does not require an npm account to exist yet.
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public
