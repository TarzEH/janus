<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 72" width="262" height="72" role="img" aria-label="JANUS">
  <title>JANUS</title>
  <desc>The JANUS mark beside a monoline wordmark. Letterforms are drawn as strokes rather than set in a font, so the lockup renders identically everywhere.</desc>

  <defs>
    <linearGradient id="lg-attack" x1="0" y1="0.1" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF9A80"/>
      <stop offset="1" stop-color="#DC4238"/>
    </linearGradient>
    <linearGradient id="lg-defend" x1="1" y1="0.1" x2="0.1" y2="1">
      <stop offset="0" stop-color="#84F5DF"/>
      <stop offset="1" stop-color="#199C87"/>
    </linearGradient>
  </defs>

  <!-- Mark, from the 64-unit master. -->
  <g transform="translate(4 4)">
    <path d="M32 2 57.6 16.9v30.2L32 62 6.4 47.1V16.9Z" fill="#101219"/>
    <path d="M32 2 57.6 16.9v30.2L32 62 6.4 47.1V16.9Z" fill="none" stroke="#39414F" stroke-width="1.5"/>
    <path d="M30.8 11.5 24 12 18.4 15.6 15.6 21.8 17.4 26.6 12.4 32.6 17.8 35.4 15.9 38.9 18.6 41.4 16.6 45.4 21.4 49.6 24.4 54.5 30.8 54.5Z" fill="url(#lg-attack)"/>
    <path d="M21.6 24.6 18.6 26.2l3 1.4Z" fill="#101219"/>
    <path d="M33.2 11.5 40 12l5.6 3.6 2.8 6.2-1.8 4.8 5 6-5.4 2.8 1.9 3.5-2.7 2.5 2 4-4.8 4.2-3 4.9h-6.4Z" fill="url(#lg-defend)"/>
    <path d="M42.4 24.6l3 1.6-3 1.4Z" fill="#101219"/>
    <path d="M32 9.5v46" stroke="#101219" stroke-width="3.4"/>
    <path d="M32 10.5v6.5M32 20.5v5.5M32 30v10M32 44v3.5M32 51.5v3" stroke="#F7D473" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: monoline, cap height 40, baseline y=56. Drawn as strokes so it
       needs no font and cannot reflow on someone else's machine. -->
  <g transform="translate(86 16)" fill="none" stroke="#E4E7EC" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 0v27a10 10 0 0 1-20 1"/>
    <g transform="translate(28 0)"><path d="M2 40 15 0l13 40M7.6 27.5h14.8"/></g>
    <g transform="translate(64 0)"><path d="M2 40V0l26 40V0"/></g>
    <g transform="translate(100 0)"><path d="M2 0v26a13 13 0 0 0 26 0V0"/></g>
    <g transform="translate(136 0)"><path d="M27 9c0-7-9-10-15-7-8 4-8 14 1 17 11 4 12 15 4 19-7 3-14 0-15-7"/></g>
  </g>
</svg>
