<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JANUS">
  <title>JANUS</title>
  <desc>Small-size variant. Face detail is dropped below ~32px and only the idea survives: two opposed sides and a boundary that breaks.</desc>

